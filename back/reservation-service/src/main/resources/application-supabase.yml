# Supabase PostgreSQL Configuration
spring:
  datasource:
    url: jdbc:postgresql://${SUPABASE_HOST:localhost}:${SUPABASE_PORT:5432}/${SUPABASE_DB:postgres}
    driver-class-name: org.postgresql.Driver
    username: ${SUPABASE_USER:postgres}
    password: ${SUPABASE_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  h2:
    console:
      enabled: false

  sql:
    init:
      mode: never

logging:
  level:
    com.tickety.reservation: INFO
    org.hibernate.SQL: WARN
    com.zaxxer.hikari: INFO
